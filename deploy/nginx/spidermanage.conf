# ==============================================================================
# SpiderManage 站点配置（供【已有 nginx 容器】使用）
# ------------------------------------------------------------------------------
# 目标：不改动、不重建现有 nginx 镜像，仅追加一个站点配置文件让本项目可访问。
#
# 两种落地方式（均不涉及镜像改动）：
#   ① 直接复制进容器并 reload（重启容器后失效，适合验证）
#        docker cp spidermanage.conf <nginx容器>:/etc/nginx/conf.d/spidermanage.conf
#        docker exec <nginx容器> nginx -t && docker exec <nginx容器> nginx -s reload
#   ② 启动现有 nginx 时多挂一个文件（推荐，容器重建后仍生效）
#        -v /opt/spidermanage/spidermanage.conf:/etc/nginx/conf.d/spidermanage.conf:ro
#
# 上游地址二选一（改下方 set $spidermanage_backend 一行即可）：
#   B1（推荐，需把现有 nginx 接入项目网络）：
#        docker network connect spidermanage_net <nginx容器>
#        set $spidermanage_backend spidermanage_frontend:80;
#   B2（不改网络，走宿主机已发布端口）：
#        set $spidermanage_backend 192.168.1.10:4200;   # 换成服务器真实 IP
#        ⚠️ 容器内不能用 127.0.0.1 指向宿主机；实测 host.docker.internal 在默认
#           bridge 网络下不可用，B2 请直接写服务器 IP
#
# 说明：本项目前端容器自身也是 nginx，已内置 /api、/ws-* 反代、gzip 与 SPA 回退，
#       所以这里整体转发给它即可，无需重复配置这些规则。
#
# 变量方式（resolver + set）比静态 upstream 更稳：容器名在请求时才解析，
# 不依赖 nginx 与项目的启动顺序，前端容器重建换 IP 后也不会 502。
# ==============================================================================

# WebSocket 所需的 Connection 头映射（必须位于 http 上下文；conf.d 正在此上下文）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name spidermanage.example.com;   # ← 改成你的域名

    # Docker 内置 DNS：仅在现有 nginx 已接入某个【自定义网络】时可用（B1 场景）。
    # 若走 B2 且现有 nginx 只在默认 bridge 网络内，请把这行注释掉（IP 字面量无需 DNS 解析）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    # B1：容器名（需先 docker network connect spidermanage_net <nginx容器>）
    set $spidermanage_backend spidermanage_frontend:80;
    # B2：宿主机地址——必须用服务器真实 IP（实测 host.docker.internal 在默认 bridge 下不可用）
    # set $spidermanage_backend 192.168.1.10:4200;   # ← 换成服务器真实 IP

    access_log /var/log/nginx/spidermanage.access.log;
    error_log  /var/log/nginx/spidermanage.error.log warn;

    # 爬虫代码包上传（zip）可能较大，默认 1m 会导致 413
    client_max_body_size 100m;

    # 通用代理头（供内层前端 nginx 与后端 Master 识别真实来源）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 实时日志 WebSocket ──
    location /ws-logs/ {
        proxy_pass http://$spidermanage_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 实时数据 WebSocket ──
    location /ws-data/ {
        proxy_pass http://$spidermanage_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 其余请求（静态资源 + /api + /docs + SPA 回退）全部交给项目前端容器 ──
    location / {
        proxy_pass http://$spidermanage_backend;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# ==============================================================================
# 如需 HTTPS：沿用现有 nginx 既有的证书与配置方式，把上面 server 块复制一份，
# 将 listen 改为 `listen 443 ssl;`（并补 `http2 on;` 与证书路径）即可。
# 证书挂载属于现有 nginx 的运行参数，同样不需要改动镜像。
# ==============================================================================
