# ============================================
# SpiderManage 前端 Nginx 配置
# ============================================
# 功能：
#   1. 托管 Vite 构建的 SPA 静态资源
#   2. 反向代理 /api 请求到后端 Master 服务
#   3. 反向代理 /ws-logs 和 /ws-data WebSocket 到后端
#   4. 开启 Gzip 压缩提升传输效率
# ============================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── 静态资源缓存（Vite 带 hash 的资源可长期缓存）──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── REST API 反向代理 ──
    location /api/ {
        proxy_pass http://master:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传支持（爬虫代码包可能较大）
        client_max_body_size 100m;
    }

    # ── WebSocket 反向代理：实时日志流 ──
    location /ws-logs/ {
        proxy_pass http://master:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── WebSocket 反向代理：实时数据流 ──
    location /ws-data/ {
        proxy_pass http://master:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Swagger API 文档代理 ──
    location /docs {
        proxy_pass http://master:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://master:8000;
        proxy_set_header Host $host;
    }

    # ── SPA 路由 fallback ──
    # React Router 使用 BrowserRouter，所有未匹配的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
